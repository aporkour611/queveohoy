name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil EAS
        type: choice
        options:
          - preview
          - production
        default: preview
      platform:
        description: Plataforma
        type: choice
        options:
          - android
          - ios
          - all
        default: android

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::EXPO_TOKEN no configurado — salta build EAS"
            exit 0
          fi
          eas build --non-interactive --profile "${{ inputs.profile }}" --platform "${{ inputs.platform }}"
