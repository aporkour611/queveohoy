name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil EAS
        type: choice
        options:
          - preview
          - preview-store
          - production
          - production-store
        default: preview
      platform:
        description: Plataforma
        type: choice
        options:
          - android
          - ios
          - all
        default: android
      submit:
        description: Auto-submit a stores (usa perfil *-store o --auto-submit)
        type: boolean
        default: false

  push:
    tags:
      - "mobile-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::EXPO_TOKEN no configurado — salta build EAS"
            exit 0
          fi

          PROFILE="${{ inputs.profile }}"
          PLATFORM="${{ inputs.platform }}"
          AUTO_SUBMIT="${{ inputs.submit }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            PROFILE="preview-store"
            PLATFORM="android"
            AUTO_SUBMIT="true"
          fi

          ARGS=(build --non-interactive --profile "$PROFILE" --platform "$PLATFORM")

          if [ "$AUTO_SUBMIT" = "true" ] || [[ "$PROFILE" == *-store ]]; then
            ARGS+=(--auto-submit)
          fi

          eas "${ARGS[@]}"

      - name: Resumen
        if: success()
        run: |
          echo "### EAS Build OK — perfil ${{ inputs.profile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Plataforma: ${{ inputs.platform }}" >> "$GITHUB_STEP_SUMMARY"
