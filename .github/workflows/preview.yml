name: Preview Deploy

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_4aqwN7f100zOxDc6ABydAWAq
  VERCEL_PROJECT_ID: prj_GRwiJU36eEslistBVxWnBgflIqe7

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Build preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Deploy preview
        id: deploy
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee /tmp/vercel-preview.log
          url=$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-preview.log | tail -n 1)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url"

      - name: Summary
        run: echo "### Preview ${{ steps.deploy.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
