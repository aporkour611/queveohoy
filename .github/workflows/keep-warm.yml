name: Keep warm (prod)

on:
  schedule:
    # Respaldo al cron Vercel (cachés cada 5 min, origen cada 15 min)
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Precalentar Vercel + Supabase + ISR
        env:
          SITE_URL: https://queveohoy.es
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KEEP_WARM_FULL: "1"
        run: node scripts/keep-warm-prod.mjs
