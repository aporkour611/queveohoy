name: Keep warm (prod)

on:
  schedule:
    # Hobby: sin crons Vercel frecuentes — GHA cada 3 min
    - cron: "*/3 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Skip if Vercel paused
        id: paused
        run: |
          if [ -f docs/PROD_VERCEL_PAUSED ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Keep-warm omitido — docs/PROD_VERCEL_PAUSED"
          fi

      - uses: actions/setup-node@v5
        if: steps.paused.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Precalentar Vercel + Supabase + ISR
        if: steps.paused.outputs.skip != 'true'
        env:
          SITE_URL: https://queveohoy.es
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KEEP_WARM_FULL: "1"
        run: node scripts/keep-warm-prod.mjs
