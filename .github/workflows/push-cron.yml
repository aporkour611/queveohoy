name: Push notifications cron

on:
  schedule:
    # Hobby: push ligero cada 30 min (~48 req/día)
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: push-notifications-cron
  cancel-in-progress: false

jobs:
  push-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skip if Vercel paused
        id: paused
        run: |
          if [ -f docs/PROD_VERCEL_PAUSED ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Push cron omitido — docs/PROD_VERCEL_PAUSED"
          fi

      - uses: actions/setup-node@v5
        if: steps.paused.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Disparar /api/push/cron
        if: steps.paused.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta CRON_SECRET en GitHub Secrets"
            exit 1
          fi
          curl -fsS --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://queveohoy.es/api/push/cron"
