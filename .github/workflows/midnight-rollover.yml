name: Midnight rollover (Madrid)

on:
  schedule:
    # 00:00 Europe/Madrid ≈ 22:00 UTC (CEST) o 23:00 UTC (CET)
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ejecutar aunque no sea medianoche Madrid"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: midnight-rollover
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar medianoche Madrid
        id: gate
        run: |
          HOUR=$(TZ=Europe/Madrid date +%H)
          echo "Madrid hour: $HOUR"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - name: Skip if Vercel paused
        id: paused
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -f docs/PROD_VERCEL_PAUSED ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Midnight rollover omitido — docs/PROD_VERCEL_PAUSED"
          fi

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true' && steps.paused.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true' && steps.paused.outputs.skip != 'true'
        run: npm ci

      - name: Cron producción (purga ayer + ingestar semana)
        if: steps.gate.outputs.run == 'true' && steps.paused.outputs.skip != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://queveohoy.es
          FORCE_MIDNIGHT: "1"
        run: |
          set -euo pipefail
          RES=$(curl -fsS --retry 2 --retry-delay 8 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://queveohoy.es/api/midnight-rollover?force=1")
          echo "$RES" | head -c 2000
          echo "$RES" | grep -q '"ok":true'

      - name: Sync TMDB + portadas editoriales
        if: steps.gate.outputs.run == 'true' && steps.paused.outputs.skip != 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${TMDB_API_KEY:-}" ]; then
            node scripts/sync-tv-tmdb-posters.mjs
          else
            echo "::warning::TMDB_API_KEY no configurado en GitHub Secrets"
          fi
          npm run posters

      - name: Test + checklist release
        if: steps.gate.outputs.run == 'true' && steps.paused.outputs.skip != 'true'
        run: |
          npm test
          npm run verify:release

      - name: Commit portadas si cambiaron
        if: steps.gate.outputs.run == 'true' && steps.paused.outputs.skip != 'true'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/spanish-tv-tmdb-posters.json public/posters public/flagship public/deportes public/ciclismo public/competition-logos 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios en portadas"
          else
            git commit -m "chore(posters): portadas editoriales tras rollover Madrid"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy producción (solo si no hubo push)
        if: steps.gate.outputs.run == 'true' && steps.paused.outputs.skip != 'true' && steps.commit.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
