name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy a la vez; cancelar runs colgados al llegar un push nuevo.
concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_4aqwN7f100zOxDc6ABydAWAq
  VERCEL_PROJECT_ID: prj_GRwiJU36eEslistBVxWnBgflIqe7

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    env:
      CI: true
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build
        run: |
          unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY || true
          npm run build

      - name: E2E smoke
        run: |
          unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY || true
          npm run test:e2e -- --reporter=line

  deploy:
    needs: [validate, e2e]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Verify Supabase env for build
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          if [ ! -f "$env_file" ]; then
            echo "::error::No se generó $env_file tras vercel pull"
            exit 1
          fi
          missing=0
          for key in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ADMIN_SECRET; do
            if ! grep -qE "^${key}=.+$" "$env_file"; then
              echo "::warning::Falta $key en el entorno de producción de Vercel"
              missing=$((missing + 1))
            fi
          done
          if ! grep -qE "^(NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_ANON_KEY)=" "$env_file"; then
            echo "::warning::Falta clave anon/publishable de Supabase en Vercel"
            missing=$((missing + 1))
          fi
          if [ "$missing" -gt 0 ]; then
            echo "::warning::Añade SUPABASE_URL y SUPABASE_ANON_KEY (runtime) en Vercel si el feed sale vacío tras deploy prebuilt"
          fi

      - name: Build (una sola vez)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if ! vercel deploy --prebuilt --prod --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee /tmp/vercel-deploy.log; then
            echo "::error::Vercel deploy failed"
            tail -n 60 /tmp/vercel-deploy.log || true
            if grep -qE "api-deployments-free-per-day|api-upload-free|Resource is limited" /tmp/vercel-deploy.log; then
              echo "::warning::Cuota de deploys de Vercel agotada. Reintenta en unas horas."
            fi
            exit 1
          fi
          url=$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1)
          if [ -z "$url" ]; then
            url=$(grep -Eo 'https://[^ ]+' /tmp/vercel-deploy.log | tail -n 1)
          fi
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
          if [ -n "$url" ]; then
            vercel inspect "$url" --wait --timeout 900 --token="${{ secrets.VERCEL_TOKEN }}" || echo "::warning::vercel inspect timeout (el alias puede tardar)"
          fi

      - name: Smoke test producción
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://queveohoy.es/api/v1/search?q=real&limit=1")
            echo "Intento $i: /api/v1/search → $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::Producción no responde /api/v1/search (HTTP $code)"
            exit 1
          fi
          echo "Calentando caché del feed…"
          curl -sf "https://queveohoy.es/api/events?scope=home" -o /tmp/feed-home.json
          events=$(node -e "const d=require('/tmp/feed-home.json'); console.log((d.events||[]).length)")
          echo "Eventos en home feed: $events"
          health_code=$(curl -s -o /tmp/health.json -w "%{http_code}" "https://queveohoy.es/api/health")
          echo "Health HTTP $health_code"
          if [ "$health_code" != "200" ]; then
            echo "::error::Health no ready (HTTP $health_code). Revisa DB/feed."
            cat /tmp/health.json || true
            exit 1
          fi
          if [ "$events" = "0" ]; then
            body=$(cat /tmp/feed-home.json)
            if echo "$body" | grep -q '"error"'; then
              echo "::error::Feed vacío con error: $body"
              exit 1
            fi
            echo "::warning::Feed vacío (0 eventos). Ejecutando cron…"
          fi
          if [ -n "${CRON_SECRET:-}" ]; then
            echo "Invalidando caché del feed y la home…"
            curl -sf "https://queveohoy.es/api/indexing/ping" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -o /tmp/revalidate.json || echo "::warning::indexing/ping falló"
            node -e "try{const d=require('/tmp/revalidate.json');console.log('revalidate',d.feedCache?.ok??d.ok)}catch(e){console.log('revalidate skip')}" || true
          fi
          curl -sf "https://queveohoy.es/api/health" -o /dev/null || true
          curl -sf "https://queveohoy.es/api/v2/feed" -o /dev/null || true
          curl -sf "https://queveohoy.es/" -o /dev/null --max-time 90 || true
          home_code=$(curl -s --max-time 90 -o /dev/null -w "%{http_code}" "https://queveohoy.es/" || echo "000")
          echo "Home HTTP $home_code"
          if [ "$home_code" != "200" ]; then
            echo "::error::Home respondió $home_code"
            exit 1
          fi
          echo "Keep-warm completo post-deploy…"
          CRON_SECRET="${CRON_SECRET:-}" node scripts/keep-warm-prod.mjs || echo "::warning::keep-warm post-deploy falló"
          echo "Verificación lanzamiento 2.0…"
          node scripts/verify-prod-2.0.mjs
          echo "Integraciones en producción…"
          node scripts/check-integrations.mjs
          if [ "$events" = "0" ] && [ -n "${CRON_SECRET:-}" ]; then
            echo "Ejecutando cron para repoblar eventos…"
            vercel env run --environment=production -- bash -c \
              'curl -sf "https://queveohoy.es/api/cron" -H "Authorization: Bearer ${CRON_SECRET}" -o /tmp/cron.json && node -e "const d=require(\"/tmp/cron.json\"); console.log(\"cron football:\", d.football?.count ?? 0, \"supabase:\", d.supabaseConfigured)"'
          fi

      - uses: browser-actions/setup-chrome@v1

      - name: PSI presupuesto LCP en producción
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          CRON_SECRET="${CRON_SECRET:-}" node scripts/keep-warm-prod.mjs || true
          sleep 8
          if PERF_URL=https://queveohoy.es \
            PERF_BUDGET_LCP_MS=2000 \
            PERF_BUDGET_MIN=80 \
            PERF_RETRIES=2 \
            npm run perf:budget; then
            echo "### PSI LCP presupuesto OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::PSI LCP incumplido o Lighthouse falló (no bloquea deploy)"
            echo "### PSI LCP — warning (revisar logs)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deployment summary
        run: echo "### Production ${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"

  gate:
    needs: [validate, e2e, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require validate + deploy success
        run: |
          set -euo pipefail
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "::error::validate failed"
            exit 1
          fi
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "::error::deploy failed"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::warning::e2e smoke failed (non-blocking); revisa artefactos del job e2e"
          fi
          echo "Production deploy OK"
