name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy a la vez; cancelar runs colgados al llegar un push nuevo.
concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_4aqwN7f100zOxDc6ABydAWAq
  VERCEL_PROJECT_ID: prj_GRwiJU36eEslistBVxWnBgflIqe7

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Build (una sola vez)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if ! vercel deploy --prebuilt --prod --no-wait --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee /tmp/vercel-deploy.log; then
            echo "::error::Vercel deploy failed"
            if grep -q "api-deployments-free-per-day" /tmp/vercel-deploy.log; then
              echo "::warning::Cuota diaria de deploys de Vercel agotada (100/día). Reintenta mañana o redeploy manual desde el dashboard."
            fi
            exit 1
          fi
          url=$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1)
          if [ -z "$url" ]; then
            url=$(grep -Eo 'https://[^ ]+' /tmp/vercel-deploy.log | tail -n 1)
          fi
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
          if [ -n "$url" ]; then
            vercel inspect "$url" --wait --timeout 900 --token="${{ secrets.VERCEL_TOKEN }}"
          fi

      - name: Smoke test producción
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://queveohoy.es/api/v1/search?q=real&limit=1")
            echo "Intento $i: /api/v1/search → $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Producción no expone v4 (/api/v1/search sigue en $code)"
          exit 1

      - name: Deployment summary
        run: echo "### Production ${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
