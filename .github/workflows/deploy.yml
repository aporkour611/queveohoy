name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy a la vez; cancelar runs colgados al llegar un push nuevo.
concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_4aqwN7f100zOxDc6ABydAWAq
  VERCEL_PROJECT_ID: prj_GRwiJU36eEslistBVxWnBgflIqe7

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Verify Supabase env for build
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          if [ ! -f "$env_file" ]; then
            echo "::error::No se generó $env_file tras vercel pull"
            exit 1
          fi
          missing=0
          for key in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if ! grep -q "^${key}=" "$env_file"; then
              echo "::warning::Falta $key en el entorno de producción de Vercel"
              missing=$((missing + 1))
            fi
          done
          if ! grep -qE "^(NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_ANON_KEY)=" "$env_file"; then
            echo "::warning::Falta clave anon/publishable de Supabase en Vercel"
            missing=$((missing + 1))
          fi
          if [ "$missing" -gt 0 ]; then
            echo "::warning::Añade SUPABASE_URL y SUPABASE_ANON_KEY (runtime) en Vercel si el feed sale vacío tras deploy prebuilt"
          fi

      - name: Build (una sola vez)
        run: vercel env run --environment=production -- vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if ! vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee /tmp/vercel-deploy.log; then
            echo "::error::Vercel deploy failed"
            tail -n 40 /tmp/vercel-deploy.log || true
            if grep -qE "api-deployments-free-per-day|api-upload-free" /tmp/vercel-deploy.log; then
              echo "::warning::Cuota de Vercel agotada. Se activó git.deploymentEnabled: el push también dispara build en Vercel."
            fi
            exit 1
          fi
          url=$(grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1)
          if [ -z "$url" ]; then
            url=$(grep -Eo 'https://[^ ]+' /tmp/vercel-deploy.log | tail -n 1)
          fi
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
          if [ -n "$url" ]; then
            vercel inspect "$url" --wait --timeout 900 --token="${{ secrets.VERCEL_TOKEN }}" || echo "::warning::vercel inspect timeout (el alias puede tardar)"
          fi

      - name: Smoke test producción
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://queveohoy.es/api/v1/search?q=real&limit=1")
            echo "Intento $i: /api/v1/search → $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::Producción no expone v4 (/api/v1/search sigue en $code)"
            exit 1
          fi
          echo "Calentando caché del feed…"
          curl -sf "https://queveohoy.es/api/events?scope=home" -o /tmp/feed-home.json
          events=$(node -e "const d=require('/tmp/feed-home.json'); console.log((d.events||[]).length)")
          echo "Eventos en home feed: $events"
          if [ "$events" = "0" ]; then
            body=$(cat /tmp/feed-home.json)
            if echo "$body" | grep -q '"error"'; then
              echo "::warning::Feed vacío con error: $body"
            else
              echo "::warning::Feed vacío (0 eventos). Comprueba SUPABASE_URL/SUPABASE_ANON_KEY en Vercel y ejecuta el cron."
            fi
          fi
          curl -sf "https://queveohoy.es/" -o /dev/null
          echo "Home precalentada"

      - name: Deployment summary
        run: echo "### Production ${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
