name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Test coverage
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build
        run: |
          unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY || true
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: E2E smoke
        run: |
          unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY || true
          npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

  perf-budget:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Start server
        run: npm run start &
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ || echo "000")
            echo "Intento $i: home → $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Lighthouse perf budget (opcional)
        run: npm run perf:budget
        continue-on-error: true
        env:
          PERF_URL: http://127.0.0.1:3000
          PERF_BUDGET_MIN: 50
          PERF_BUDGET_LCP_MS: 4000

      - name: Lighthouse CI (quality gates)
        run: npx lhci autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
