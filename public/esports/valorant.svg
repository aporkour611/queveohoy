<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Valorant">
  <defs>
    <linearGradient id="val-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0810"/>
      <stop offset="40%" stop-color="#0c0608"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="val-glow" cx="50%" cy="30%" r="62%">
      <stop offset="0%" stop-color="#ff4655" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff4655" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="val-beam" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4655" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff4655" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff4655" stop-opacity="0"/>
    </linearGradient>
    <filter id="val-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="400" height="600" fill="url(#val-sky)"/>
  <rect width="400" height="600" fill="url(#val-glow)"/>
  <rect x="-30" y="60" width="460" height="140" fill="url(#val-beam)" transform="rotate(8 200 300)"/>
  <ellipse cx="200" cy="530" rx="210" ry="75" fill="#000" opacity="0.5" filter="url(#val-blur)"/>
  <path d="M0 430 Q140 370 200 395 T400 420 V600 H0 Z" fill="#0a0506" opacity="0.88"/>
  <g transform="translate(200 230)">
    <path d="M-72 95 L0 -95 L72 95 Z" fill="none" stroke="#ff4655" stroke-width="16" stroke-linejoin="round"/>
    <path d="M-42 95 L0 15 L42 95 Z" fill="#ff4655"/>
  </g>
  <text x="200" y="380" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Helvetica, sans-serif" font-size="42" font-weight="900" letter-spacing="8">VALORANT</text>
  <text x="200" y="412" text-anchor="middle" fill="#fda4af" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="5">TACTICAL FPS</text>
</svg>
