<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Dota 2">
  <defs>
    <linearGradient id="dota-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180808"/>
      <stop offset="42%" stop-color="#0a0505"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="dota-glow" cx="50%" cy="26%" r="66%">
      <stop offset="0%" stop-color="#e04b4b" stop-opacity="0.48"/>
      <stop offset="48%" stop-color="#7f1d1d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dota-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <filter id="dota-blur" x="-20%" y="-20%" width="140%" height="140%">
