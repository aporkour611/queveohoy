    </filter>
  </defs>
  <rect width="400" height="600" fill="url(#dota-sky)"/>
  <rect width="400" height="600" fill="url(#dota-glow)"/>
  <rect x="-35" y="70" width="470" height="135" fill="url(#dota-beam)" transform="rotate(-10 200 300)"/>
  <ellipse cx="200" cy="528" rx="218" ry="76" fill="#000" opacity="0.54" filter="url(#dota-blur)"/>
  <path d="M0 418 Q150 358 200 388 T400 415 V600 H0 Z" fill="#0a0404" opacity="0.88"/>
  <g transform="translate(200 228)">
